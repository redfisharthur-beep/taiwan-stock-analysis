name: Unit tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/worker.js
      - run: node --check src/providers.js
      - run: node --check src/scoring.js
      - run: node --check public/app.js
      - run: npm test
